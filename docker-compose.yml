services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - radar-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  radar-pgdata:
